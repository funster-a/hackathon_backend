name: mobile
description: FinSight - Smart Financial Assistant
publish_to: 'none'
version: 1.0.0+1

environment:
  # 👇 Понизили требование с 3.24.0 до 3.10.0, чтобы прошел твой текущий SDK
  sdk: '>=3.10.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # 👇 Стабильные версии под старый Flutter
  dio: ^5.3.0
  file_picker: ^10.3.7
  fl_chart: ^1.1.1      # Версия 0.66 требует новый Dart, поэтому берем 0.63
  google_fonts: ^6.3.2
  intl: ^0.20.2
  shared_preferences: ^2.5.3
  pinput: ^3.0.0
  image_picker: ^1.0.7
  path_provider: ^2.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.13.1
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/icon.png

# Конфигурация для генерации иконок приложения
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/icon.png"
  adaptive_icon_background: "#2E3A59"
  adaptive_icon_foreground: "assets/icon.png"
  remove_alpha_ios: true

# Конфигурация для сплеш-скрина
flutter_native_splash:
  color: "#2E3A59"
  android: true
  ios: true
  android_12:
    color: "#2E3A59"
    icon_background_color: "#2E3A59"